org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Pin the JDK for Gradle to Android Studio's bundled JBR (JDK 21). The system
# JAVA_HOME points to JDK 26, which Gradle 8.9 does not support ("Can't use
# Java 26 and Gradle 8.9"). JDK 21 is fully supported by Gradle 8.9 and is the
# recommended JDK for Flutter Android builds.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=false
android.enableOpenGLTraces=false
android.suppressUnsupportedCompileSdk=36
