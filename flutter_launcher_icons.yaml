# dart run flutter_launcher_icons
# App icon: "My Shop" storefront logo, applied to every platform.
flutter_launcher_icons:
  image_path: "assets/my-shop-1024.png"

  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  # White background so the storefront sits on a clean surface inside the
  # round/squircle adaptive-icon mask on Android 8+.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/my-shop-1024.png"

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

  web:
    generate: true
    image_path: "assets/my-shop-1024.png"
    background_color: "#ffffff"
    theme_color: "#ff6701"

  windows:
    generate: true
    image_path: "assets/my-shop-1024.png"
    icon_size: 256 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/my-shop-1024.png"
